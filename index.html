<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Побег из лабиринта</title>
 <style>
 html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
 canvas { width: 100%; height: 100%; display: block; touch-action: none; }
 #score, #hint, #message {
 position: fixed; z-index: 2; font-family: Arial, sans-serif;
 padding: 12px 16px; border-radius: 12px;
 box-shadow: 0 4px 14px #0002;
 }
 #score { left: 18px; top: 18px; background: white;
 color: #273665; font-size: 21px; font-weight: bold; }
 #hint { left: 18px; bottom: 18px; background: #24335dcc;
 color: white; font-size: 15px; }
 #message { display: none; left: 50%; top: 50%;
 transform: translate(-50%, -50%); background: #ffffffed;
 color: #25513b; font-size: 30px; font-weight: bold;
 text-align: center; }
 </style>
</head>
<body>
 <div id="score">Звёзды: 0/3</div>
 <div id="hint">W A S D — движение · Собери 3 звезды</div>
 <div id="message">Победа! ★★★</div>
 <canvas id="screen"></canvas>
 <script src="./babylon.js"></script>
 <script src="./game.js"></script>
</body>
</html>
